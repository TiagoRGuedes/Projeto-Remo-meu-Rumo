name: Deploy no Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: true

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Login do site: usuário e senha vêm dos segredos do repositório (Settings > Secrets), nunca do código.
      - name: Credenciais do login
        env:
          U: ${{ secrets.ADMIN_USUARIO }}
          S: ${{ secrets.ADMIN_SENHA }}
        run: |
          test -n "$U" && test -n "$S" || { echo "Faltam os segredos ADMIN_USUARIO/ADMIN_SENHA"; exit 1; }
          printf '\nadmin.usuario=%s\nadmin.senha=%s\n' "$U" "$S" >> src/main/resources/application.properties
      - name: Build e testes (Maven)
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: remomeurumo-presenca
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/*.jar
