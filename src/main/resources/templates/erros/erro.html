<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Aviso')}"></head>
<body th:class="${temaClasses}">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header th:replace="~{fragments/header :: header}"></header>
<div class="app-shell">
    <nav th:replace="~{fragments/sidebar :: sidebar}"></nav>
    <main id="conteudo" class="content" tabindex="-1">
        <section class="error-state">
            <span class="error-code" aria-hidden="true">!</span>
            <h1>Não foi possível concluir</h1>
            <p class="muted" th:text="${mensagem}">Confira as informações e tente novamente.</p>
            <a class="button button-primary" th:href="@{/}"><span class="icon icon-arrow" aria-hidden="true"></span>Voltar para a Visão geral</a>
        </section>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
</body>
</html>
