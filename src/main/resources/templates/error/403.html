<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acesso negado')}"></head>
<body th:class="${temaClasses}">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header th:replace="~{fragments/header :: header}"></header>
<div class="app-shell">
    <nav th:replace="~{fragments/sidebar :: sidebar}"></nav>
    <main id="conteudo" class="content" tabindex="-1">
        <section class="error-state">
            <span class="error-code" aria-hidden="true">403</span>
            <h1>Você não tem acesso a esta página</h1>
            <p class="muted">O seu perfil não permite abrir esta área.</p>
            <a class="button button-primary" th:href="@{/chamada}"><span class="icon icon-arrow" aria-hidden="true"></span>Ir para a chamada</a>
        </section>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
</body>
</html>
