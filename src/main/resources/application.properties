spring.application.name=remo-meu-rumo
server.port=8080

spring.datasource.url=jdbc:h2:file:./dados/remo-meu-rumo;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.forward-headers-strategy=native
# X-Forwarded-For só é aceito de proxies internos (rede privada do Azure); de fora, ou de localhost, é ignorado.
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}

app.dados-demonstracao=false
spring.web.locale=pt-BR
spring.web.locale-resolver=fixed
server.servlet.session.tracking-modes=cookie
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB
